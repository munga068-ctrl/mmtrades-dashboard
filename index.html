// Applied before the stylesheet paints anything, so the page never flashes
// the wrong theme on load.
(function(){

    var theme = saved || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){ /* localStorage unavailable; defaults to light */ }
})();

// ---- Load Chart.js, trying a few mirrors in case one is blocked/unreachable
// (e.g. by an ad-blocker, DNS filter, or a flaky shared connection) ----
function loadScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.onload = () => resolve(true);
    s.onerror = () => reject(new Error('failed to load ' + src));
    document.head.appendChild(s);
  });
}
const CHART_JS_MIRRORS = [
  "https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js",
  "https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js",
  "https://unpkg.com/chart.js@4.4.4/dist/chart.umd.min.js",
];
async function loadChartJs(){
  for(const url of CHART_JS_MIRRORS){
    try{
      await loadScript(url);
      if(typeof Chart !== 'undefined') return true;
    }catch(e){ /* try next mirror */ }
  }
  return false;
}
</script>

  const syncedAt = new Date(DATA_SYNCED_AT);
  const minutesAgo = Math.max(0, Math.round((Date.now() - syncedAt.getTime()) / 60000));

  let ago;
  if(minutesAgo < 1) ago = "just now";
  else if(minutesAgo < 60) ago = minutesAgo + " min ago";
  else if(minutesAgo < 1440) ago = Math.round(minutesAgo / 60) + " hr ago";
  else ago = Math.round(minutesAgo / 1440) + " days ago";

  const isStale = minutesAgo > STALE_THRESHOLD_MINUTES;
  statusLine.textContent = isStale
    ? `Last synced ${ago} — this looks stale, the numbers above may be behind. Trigger the sync workflow manually to refresh.`
    : `Synced ${ago}`;
  statusLine.className = isStale ? "stale" : "synced";
}

// Keep the "X min ago" label ticking, and re-flag staleness, without needing a page reload.
setInterval(updateStatusLine, 30000);

async function fetchTrades(rangeStart, rangeEnd){
  return TRADES.filter(t => t.date >= rangeStart && t.date <= rangeEnd);
}

// ---- Metrics + charts (all-time, independent of month navigation) ----
function dailyAggregate(trades){
  const byDate = {};
  trades.forEach(t => {
    const key = t.date;
    byDate[key] = (byDate[key] || 0) + Number(t.pnl || 0);
  });
  return Object.keys(byDate).sort().map(date => ({ date, pnl: byDate[date] }));
}

function computeMetrics(trades){
  const wins = trades.filter(t => t.pnl > 0);
  const losses = trades.filter(t => t.pnl < 0);
  const breakevenCount = trades.length - wins.length - losses.length;
  const netPnl = trades.reduce((s,t) => s + t.pnl, 0);
  const winRate = trades.length ? (wins.length / trades.length) * 100 : 0;
  const avgWin = wins.length ? wins.reduce((s,t)=>s+t.pnl,0) / wins.length : 0;
  const avgLoss = losses.length ? losses.reduce((s,t)=>s+t.pnl,0) / losses.length : 0;
  const grossWin = wins.reduce((s,t)=>s+t.pnl,0);
  const grossLoss = Math.abs(losses.reduce((s,t)=>s+t.pnl,0));
  const profitFactor = grossLoss > 0 ? grossWin / grossLoss : (grossWin > 0 ? Infinity : 0);
  const avgWinLossRatio = avgLoss !== 0 ? Math.abs(avgWin / avgLoss) : (avgWin > 0 ? Infinity : 0);
  const expectancy = trades.length ? netPnl / trades.length : 0;

  const daily = dailyAggregate(trades);
  let equity = 0, peak = 0, maxDD = 0;
  const equityCurve = daily.map(d => {
    equity += d.pnl;
    peak = Math.max(peak, equity);
    maxDD = Math.max(maxDD, peak - equity);
    return { date: d.date, equity };
  });
  const maxDDPct = peak > 0 ? (maxDD / peak) * 100 : 0;
  const recoveryFactor = maxDD > 0 ? netPnl / maxDD : (netPnl > 0 ? Infinity : 0);

  // Current streak (consecutive winning or losing trading days, most recent first)
  let streakCount = 0, streakType = null;
  for(let i = daily.length - 1; i >= 0; i--){
    const isWin = daily[i].pnl > 0;
    if(streakType === null){ streakType = isWin ? 'win' : 'loss'; streakCount = 1; }
    else if((isWin && streakType === 'win') || (!isWin && streakType === 'loss')){ streakCount++; }
    else break;
  }

  // Consistency: how concentrated profits are in the single best day (lower concentration = more consistent)
  const totalPositive = daily.filter(d=>d.pnl>0).reduce((s,d)=>s+d.pnl,0);
  const bestDay = daily.reduce((m,d)=>Math.max(m,d.pnl),0);
  const consistency = totalPositive > 0 ? Math.max(0, Math.min(100, 100 * (1 - bestDay/totalPositive))) : 100;

  const weekdayPnl = weekdayAggregate(trades);

  return { netPnl, winRate, avgWin, avgLoss, profitFactor, avgWinLossRatio, expectancy, maxDD, maxDDPct, recoveryFactor, streakCount, streakType, consistency, equityCurve, weekdayPnl, tradeCount: trades.length, dayCount: daily.length, winCount: wins.length, lossCount: losses.length, breakevenCount };
}

// ---- Yearly / Monthly report card metrics ----
function computeReportMetrics(trades, startingEquity){
  const wins = trades.filter(t => t.pnl > 0);
  const losses = trades.filter(t => t.pnl < 0);
  const netPnl = trades.reduce((s,t)=>s+t.pnl,0);
  const grossProfit = wins.reduce((s,t)=>s+t.pnl,0);
  const grossLoss = losses.reduce((s,t)=>s+t.pnl,0); // negative number
  const maxWin = trades.length ? Math.max(...trades.map(t=>t.pnl), 0) : 0;
  const maxLoss = trades.length ? Math.min(...trades.map(t=>t.pnl), 0) : 0;

  const daily = dailyAggregate(trades);
  // Drawdown here is measured against the period's STARTING balance (not a running
  // peak-to-trough) — i.e. how far equity ever dipped below where the month/year opened.
  // If equity never dips below startingEquity at any point, maxDD is 0 and the period
  // is a true "No drawdown" (which also guarantees it closed at or above the start).
  let equity = startingEquity, highestEquity = startingEquity, lowestEquity = startingEquity, maxGainPct = 0;
  daily.forEach(d => {
    const before = equity;
    equity += d.pnl;
    highestEquity = Math.max(highestEquity, equity);
    lowestEquity = Math.min(lowestEquity, equity);
    if(before > 0) maxGainPct = Math.max(maxGainPct, (d.pnl / before) * 100);
  });
  const maxDD = Math.max(0, startingEquity - lowestEquity);
  const netGainPct = (netPnl / startingEquity) * 100;
  const maxWinPct = (maxWin / startingEquity) * 100;
  const maxLossPct = (maxLoss / startingEquity) * 100;
  const drawdownPct = startingEquity > 0 ? (maxDD / startingEquity) * 100 : 0;

  return { netPnl, netGainPct, maxGainPct, grossProfit, grossLoss, highestEquity, maxWin, maxWinPct, maxLoss, maxLossPct, maxDD, drawdownPct, tradeCount: trades.length };
}

function fmtPct(n){ const sign = n < 0 ? "-" : "+"; return sign + Math.abs(n).toFixed(2) + "%"; }

function renderReportCard(el, m){
  // A period only qualifies as "No drawdown" if equity never dipped below the
  // starting balance at all (maxDD ~ 0). Guard with a tiny epsilon for float rounding.
  const noDrawdown = m.maxDD <= 0.005;
  const drawdownHtml = noDrawdown
    ? `<span class="m-val pnl-pos" style="margin-left:auto;">No drawdown</span>`
    : `<span class="m-val pnl-neg" style="margin-left:auto;">-${m.drawdownPct.toFixed(1)}%</span>`;
  el.innerHTML = `
    <div class="metric-line"><span class="m-label">NET GAIN</span><span class="m-val ${m.netGainPct>=0?'pnl-pos':'pnl-neg'}">${fmtPct(m.netGainPct)}</span></div>
    <div class="metric-line"><span class="m-label">MAX GAIN</span><span class="m-val pnl-pos">${fmtPct(m.maxGainPct)}</span></div>
    <div class="metric-line"><span class="m-label">GROSS PROFIT</span><span class="m-val pnl-pos">${fmtMoney(m.grossProfit)}</span></div>
    <div class="metric-line"><span class="m-label">GROSS LOSS</span><span class="m-val pnl-neg">${fmtMoney(m.grossLoss)}</span></div>
    <div class="metric-line"><span class="m-label">Highest Equity</span><span class="m-val">${fmtMoney(m.highestEquity)}</span></div>
    <div class="metric-sub"><span class="arrow">→</span><span class="m-label2">Max Win</span><span class="m-val pnl-pos" style="margin-left:auto;">${fmtMoney(m.maxWin)} [${fmtPct(m.maxWinPct)}]</span></div>
    <div class="metric-sub"><span class="arrow">→</span><span class="m-label2">Max Loss</span><span class="m-val pnl-neg" style="margin-left:auto;">${fmtMoney(m.maxLoss)} [${fmtPct(m.maxLossPct)}]</span></div>
    <div class="metric-sub"><span class="arrow">→</span><span class="m-label2">Drawdown</span>${drawdownHtml}</div>
  `;
}

// Running account equity as of a given cutoff date (exclusive) — STARTING_BALANCE
// plus every trade's PnL that happened before that date. Used so each month/year's
// report starts from the actual closing balance of the prior period, not a reset
// $10,000 baseline.
function equityBefore(cutoff){
  let equity = STARTING_BALANCE;
  TRADES.forEach(t => {
    const d = new Date(t.date+"T00:00:00");
    if(d < cutoff) equity += Number(t.pnl) || 0;
  });
  return equity;
}

function renderYearlyMonthlyReport(year, month){
  const yearTrades = TRADES.filter(t => new Date(t.date+"T00:00:00").getFullYear() === year);
  const monthTrades = TRADES.filter(t => {
    const d = new Date(t.date+"T00:00:00");
    return d.getFullYear()===year && d.getMonth()===month;
  });
  document.getElementById('yearlyTitle').textContent = `${year} Report`;
  document.getElementById('monthlyTitle').textContent = new Date(year, month, 1).toLocaleDateString('en-US',{month:'long'}) + ' Report';

  const yearStartEquity = equityBefore(new Date(year, 0, 1));
  const monthStartEquity = equityBefore(new Date(year, month, 1));

  renderReportCard(document.getElementById('yearlyMetrics'), computeReportMetrics(yearTrades, yearStartEquity));
  renderReportCard(document.getElementById('monthlyMetrics'), computeReportMetrics(monthTrades, monthStartEquity));
}

// Cumulative P&L for Mon–Fri (index 0=Mon .. 4=Fri), summed across all trades
function weekdayAggregate(trades){
  const sums = [0, 0, 0, 0, 0];
  trades.forEach(t => {
    const d = new Date(t.date + "T00:00:00");
    const dow = d.getDay(); // 0=Sun .. 6=Sat
    if(dow >= 1 && dow <= 5){
      sums[dow - 1] += Number(t.pnl) || 0;
    }
  });
  return sums;
}

// Builds a semicircle gauge (red -> yellow -> green) with a marker dot at the
// position corresponding to `value` (clamped to [min,max]).
function makeGaugeSVG(value, min, max){
  const cx = 100, cy = 100, r = 80;
  const f = Math.max(0, Math.min(1, (value - min) / (max - min)));
  const theta = 180 - f * 180; // degrees: 180=left(min), 90=top(mid), 0=right(max)
  const rad = theta * Math.PI / 180;
  const mx = cx + r * Math.cos(rad);
  const my = cy - r * Math.sin(rad);
  const gid = 'pfGrad' + Math.random().toString(36).slice(2,8);
  return `
    <svg viewBox="0 0 200 116" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="${gid}" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#d1352b"/>
          <stop offset="50%" stop-color="#e0a83b"/>
          <stop offset="100%" stop-color="#0f8a4c"/>
        </linearGradient>
      </defs>
      <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="url(#${gid})" stroke-width="13" stroke-linecap="round"/>
      <circle cx="${mx.toFixed(2)}" cy="${my.toFixed(2)}" r="8" style="fill:var(--knob-bg); stroke:var(--ink);" stroke-width="2.5"/>
    </svg>
  `;
}

// Builds a semicircle arc split into win/breakeven/loss slices sized by trade count.
function makeWinRateArcSVG(winCount, breakevenCount, lossCount){
  const cx = 100, cy = 100, r = 80;
  const total = (winCount + breakevenCount + lossCount) || 1;
  function polar(theta){
    const rad = theta * Math.PI / 180;
    return { x: cx + r * Math.cos(rad), y: cy - r * Math.sin(rad) };
  }
  const segs = [
    { count: winCount, color: '#0f8a4c' },
    { count: breakevenCount, color: '#2f6fed' },
    { count: lossCount, color: '#d1352b' },
  ];
  let theta = 180;
  let paths = '';
  segs.forEach(s => {
    if(s.count <= 0) return;
    const sweep = (s.count / total) * 180;
    const nextTheta = theta - sweep;
    const p1 = polar(theta), p2 = polar(nextTheta);
    const large = sweep > 180 ? 1 : 0;
    paths += `<path d="M ${p1.x.toFixed(2)} ${p1.y.toFixed(2)} A ${r} ${r} 0 ${large} 1 ${p2.x.toFixed(2)} ${p2.y.toFixed(2)}" fill="none" stroke="${s.color}" stroke-width="13" stroke-linecap="butt"/>`;
    theta = nextTheta;
  });
  return `<svg viewBox="0 0 200 116" xmlns="http://www.w3.org/2000/svg">${paths}</svg>`;
}

// Builds a donut ring split between win-share and loss-share (by magnitude).
function makeRingCSS(winShare){
  const pct = Math.max(0, Math.min(100, winShare * 100));
  return `background: conic-gradient(var(--green) 0% ${pct}%, var(--red) ${pct}% 100%);`;
}

function renderStats(m){
  const streakLabel = m.streakCount > 0 ? `${m.streakCount} ${m.streakType === 'win' ? 'winning' : 'losing'} day${m.streakCount>1?'s':''}` : '—';
  const streakClass = m.streakType === 'win' ? 'pnl-pos' : (m.streakType === 'loss' ? 'pnl-neg' : '');
  const pf = isFinite(m.profitFactor) ? m.profitFactor.toFixed(2) : '∞';
  const wl = isFinite(m.avgWinLossRatio) ? m.avgWinLossRatio.toFixed(2) : '∞';

  const winMag = Math.abs(m.avgWin), lossMag = Math.abs(m.avgLoss);
  const winShare = (winMag + lossMag) > 0 ? winMag / (winMag + lossMag) : 0.5;
  const gaugeVal = isFinite(m.profitFactor) ? m.profitFactor : 3;

  const simpleCards = [
    { label: 'Net P&L (all-time)', value: fmtMoney(m.netPnl), cls: m.netPnl>=0?'pnl-pos':'pnl-neg', sub: `${m.tradeCount} trades` },
    { label: 'Trade Expectancy', value: fmtMoney(m.expectancy), cls: m.expectancy>=0?'pnl-pos':'pnl-neg', sub: 'avg P&L per trade' },
    { label: 'Current Streak', value: streakLabel, cls: streakClass, sub: `max drawdown ${fmtMoney(-m.maxDD)}` },
  ];

  const gaugeHtml = `
    <div class="stat-card gauge-card">
      <div class="stat-label">Profit Factor</div>
      <div class="gauge-wrap">
        ${makeGaugeSVG(gaugeVal, 0, 3)}
        <div class="gauge-value">${pf}</div>
      </div>
      <div class="gauge-sub">gross win ÷ gross loss</div>
    </div>
  `;

  const winRateHtml = `
    <div class="stat-card gauge-card">
      <div class="stat-label">Win Rate</div>
      <div class="gauge-wrap">
        ${makeWinRateArcSVG(m.winCount, m.breakevenCount, m.lossCount)}
        <div class="gauge-value">${m.winRate.toFixed(1)}%</div>
      </div>
      <div class="winrate-legend">
        <span class="count-chip win">${m.winCount}</span>
        ${m.breakevenCount > 0 ? `<span class="count-chip breakeven">${m.breakevenCount}</span>` : ''}
        <span class="count-chip loss">${m.lossCount}</span>
      </div>
    </div>
  `;

  const ringHtml = `
    <div class="stat-card ring-card">
      <div class="stat-label">Avg Win / Loss</div>
      <div class="ring-wrap" style="${makeRingCSS(winShare)}">
        <div class="ring-hole">${wl}</div>
      </div>
      <div class="ring-legend">
        <span class="amount-chip win">${fmtMoney(m.avgWin)}</span>
        <span class="amount-chip loss">${fmtMoney(m.avgLoss)}</span>
      </div>
    </div>
  `;

  // Order to mirror the reference layout: Net P&L, Trade Expectancy, Profit Factor,
  // Win Rate, Avg Win/Loss, Current Streak.
  statsRow.innerHTML = simpleCards.slice(0,2).map(c => `
    <div class="stat-card">
      <div class="stat-label">${c.label}</div>
      <div class="stat-value ${c.cls}">${c.value}</div>
      <div class="stat-sub">${c.sub}</div>
    </div>
  `).join('')
  + gaugeHtml
  + winRateHtml
  + ringHtml
  + simpleCards.slice(2).map(c => `
    <div class="stat-card">
      <div class="stat-label">${c.label}</div>
      <div class="stat-value ${c.cls}">${c.value}</div>
      <div class="stat-sub">${c.sub}</div>
    </div>
  `).join('');
}

let equityChartInstance = null;
let weekdayChartInstance = null;

// Reads a CSS custom property's current resolved value, so canvas-drawn
// chart colors follow the active light/dark theme instead of being frozen
// to whichever theme was active when the page first loaded.
function cv(name){
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

function renderCharts(m){
  if(typeof Chart === 'undefined'){
    // Chart.js failed to load from every mirror — show a visible message
    // instead of leaving the canvases blank with no explanation.
    document.querySelectorAll('.chart-body').forEach(el => {
      el.innerHTML = '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted);text-align:center;padding:0 12px;">Charts library couldn\'t load (network/ad-blocker may be blocking it). The calendar below is unaffected.</div>';
    });
    return;
  }

  const mutedC = cv('--muted');
  const gridC = cv('--grid-line');
  const greenC = cv('--green');
  const redC = cv('--red');
  const zeroC = cv('--zero-line');

  // Insert an exact zero-crossing point between any two points that straddle the
  // zero line. Without this, a single segment can span from positive to negative
  // and Chart.js colors that whole segment (and its fill) one color, creating a
  // mismatched wedge of the wrong color right at the crossing.
  function withZeroCrossings(points){
    const out = [];
    for(let i = 0; i < points.length; i++){
      if(i > 0){
        const prev = points[i-1], cur = points[i];
        if((prev.equity > 0 && cur.equity < 0) || (prev.equity < 0 && cur.equity > 0)){
          out.push({ date: prev.date, equity: 0 });
        }
      }
      out.push(points[i]);
    }
    return out;
  }
  const eqPoints = withZeroCrossings(m.equityCurve);
  const eqLabels = eqPoints.map(p => p.date);
  const eqData = eqPoints.map(p => p.equity);

  const eqCtx = document.getElementById('equityChart').getContext('2d');
  const greenFill = eqCtx.createLinearGradient(0,0,0,160);
  greenFill.addColorStop(0, 'rgba(15,138,76,0.35)');
  greenFill.addColorStop(1, 'rgba(15,138,76,0.03)');
  const redFill = eqCtx.createLinearGradient(0,0,0,160);
  redFill.addColorStop(0, 'rgba(209,53,43,0.03)');
  redFill.addColorStop(1, 'rgba(209,53,43,0.35)');

  // Colors each segment of the line/fill green when it's above the zero line and
  // red when it's below it, matching a win/loss-shaded cumulative P&L view.
  const segmentColor = (ctx) => (ctx.p0.parsed.y >= 0 && ctx.p1.parsed.y >= 0) ? greenC : redC;
  const segmentFill = (ctx) => (ctx.p0.parsed.y >= 0 && ctx.p1.parsed.y >= 0) ? greenFill : redFill;

  if(equityChartInstance) equityChartInstance.destroy();
  equityChartInstance = new Chart(eqCtx, {
    type: 'line',
    data: {
      labels: eqLabels,
      datasets: [
        {
          data: eqData,
          borderColor: greenC,
          fill: { target: { value: 0 } },
          backgroundColor: greenFill,
          segment: { borderColor: segmentColor, backgroundColor: segmentFill },
          tension: 0.25, pointRadius: 0, borderWidth: 2,
        },
        {
          // Dashed reference line at zero
          data: eqData.map(() => 0),
          borderColor: zeroC,
          borderDash: [4,4],
          borderWidth: 1,
          fill: false,
          pointRadius: 0,
          tension: 0,
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display:false }, tooltip: { filter: (item) => item.datasetIndex === 0, callbacks: { label: (ctx)=>'$'+ctx.parsed.y.toFixed(2) } } },
      scales: {
        x: { ticks: { maxTicksLimit: 6, color:mutedC, font:{size:10} }, grid:{ display:false } },
        y: { ticks: { color:mutedC, font:{size:10}, callback:(v)=>'$'+v }, grid:{ color:gridC } }
      }
    }
  });

  const wdLabels = ['Mon','Tue','Wed','Thu','Fri'];
  const wdData = m.weekdayPnl;
  const wdColors = wdData.map(v => v >= 0 ? 'rgba(15,138,76,0.75)' : 'rgba(209,53,43,0.75)');

  const wdCtx = document.getElementById('weekdayChart').getContext('2d');
  if(weekdayChartInstance) weekdayChartInstance.destroy();
  weekdayChartInstance = new Chart(wdCtx, {
    type: 'bar',
    data: {
      labels: wdLabels,
      datasets: [{ data: wdData, backgroundColor: wdColors, borderRadius: 4, maxBarThickness: 26, categoryPercentage: 0.55, barPercentage: 0.9 }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display:false }, tooltip: { callbacks: { label: (ctx)=>'$'+ctx.parsed.y.toFixed(2) } } },
      scales: {
        x: { ticks: { color:mutedC, font:{size:11} }, grid:{ display:false } },
        y: { ticks: { color:mutedC, font:{size:10}, callback:(v)=>'$'+v }, grid:{ color:gridC } }
      }
    }
  });
}

let durationChartInstance = null;

// "9m", "1h20m" style tick/tooltip labels for a duration given in minutes.
function formatDuration(mins){
  if(mins < 1) return Math.round(mins * 60) + 's';
  if(mins < 60) return Math.round(mins) + 'm';
  const h = Math.floor(mins / 60);
  const m = Math.round(mins % 60);
  return m > 0 ? `${h}h${m}m` : `${h}h`;
}

function renderDurationChart(rows){
  if(typeof Chart === 'undefined' || !rows.length) return;

  const mutedC = cv('--muted');
  const gridC = cv('--grid-line');
  const greenC = cv('--green');
  const redC = cv('--red');
  const zeroC = cv('--zero-line');

  const points = rows.map(r => ({ x: r.durationMin, y: r.pnl }));
  const colors = rows.map(r => r.pnl >= 0 ? greenC : redC);
  const maxX = Math.max(...rows.map(r => r.durationMin));

  const durCtx = document.getElementById('durationChart').getContext('2d');
  if(durationChartInstance) durationChartInstance.destroy();
  durationChartInstance = new Chart(durCtx, {
    type: 'scatter',
    data: {
      datasets: [
        {
          data: points,
          backgroundColor: colors,
          borderColor: colors,
          pointRadius: 5,
          pointHoverRadius: 7,
        },
        {
          // Dashed reference line at $0, spanning the full duration range
          data: [{ x: 0, y: 0 }, { x: maxX, y: 0 }],
          type: 'line',
          borderColor: zeroC,
          borderDash: [4,4],
          borderWidth: 1,
          pointRadius: 0,
          fill: false,
        }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: {
        legend: { display:false },
        tooltip: {
          filter: (item) => item.datasetIndex === 0,
          callbacks: {
            label: (ctx) => `${formatDuration(ctx.parsed.x)} · $${ctx.parsed.y.toFixed(2)}`,
          }
        }
      },
      scales: {
        x: {
          type: 'linear',
          min: 0,
          ticks: { color:mutedC, font:{size:10}, callback:(v)=>formatDuration(v) },
          grid:{ color:gridC }
        },
        y: { ticks: { color:mutedC, font:{size:10}, callback:(v)=>'$'+v }, grid:{ color:gridC } }
      }
    }
  });
}

const statsRow = document.getElementById('statsRow');

function render(trades, year, month){
  const byDate = {};
  (trades || []).forEach(t => {
    const key = (t.date || "").slice(0,10);
    if(!key) return;
    if(!byDate[key]) byDate[key] = { count:0, pnl:0 };
    byDate[key].count += 1;
    byDate[key].pnl += Number(t.pnl) || 0;
  });

  const gridStart = startOfGrid(year, month);
  const gridEnd = endOfGrid(year, month);

  // Build weeks
  const weeks = [];
  let cursor = new Date(gridStart);
  while(cursor <= gridEnd){
    const week = [];
    for(let i=0;i<7;i++){
      week.push(new Date(cursor));
      cursor.setDate(cursor.getDate()+1);
    }
    weeks.push(week);
  }

  // Render calendar
  calBody.innerHTML = "";
  let monthPnl = 0, monthDays = 0;

  weeks.forEach(week => {
    const row = document.createElement('div');
    row.className = 'week-row';
    week.forEach(d => {
      const inMonth = d.getMonth() === month;
      const iso = toISO(d);
      const cell = document.createElement('div');
      cell.className = 'day' + (inMonth ? '' : ' blank') + (iso === todayStr ? ' today' : '');
      const info = byDate[iso];
      let inner = `<div class="num">${d.getDate()}</div>`;
      if(inMonth && info){
        const cls = info.pnl >= 0 ? 'win' : 'loss';
        cell.classList.add(cls);
        inner += `<div class="trades">${info.count} ⇄</div><div class="amount">${fmtMoney(info.pnl)}</div>`;
        if(inMonth){ monthPnl += info.pnl; monthDays += 1; }
      }
      cell.innerHTML = inner;
      row.appendChild(cell);
    });
    calBody.appendChild(row);
  });

  monthPill.innerHTML = `PnL: <span class="${monthPnl >= 0 ? 'pnl-pos' : 'pnl-neg'}">${fmtMoney(monthPnl)}</span> &nbsp;|&nbsp; Days: <b>${monthDays}</b>`;

  // Weekly summary sidebar
  weeklyBody.innerHTML = "";
  const ordinals = ["One","Two","Three","Four","Five","Six"];
  weeks.forEach((week, i) => {
    let pnl = 0, days = 0;
    week.forEach(d => {
      if(d.getMonth() !== month) return;
      const iso = toISO(d);
      if(byDate[iso]){ pnl += byDate[iso].pnl; days += 1; }
    });
    const valueCls = pnl > 0 ? 'pnl-pos' : (pnl < 0 ? 'pnl-neg' : '');
    const card = document.createElement('div');
    card.className = 'week-card';
    card.innerHTML = `
      <div class="wk-name">Week ${ordinals[i] || i+1}</div>
      <div class="wk-value ${valueCls}">${fmtMoney(pnl)}</div>
      <span class="day-badge">${days} day${days === 1 ? '' : 's'}</span>
    `;
    weeklyBody.appendChild(card);
  });

  syncWeeklyHeights();
}

// The calendar's day cells can grow taller than their 84px minimum when a day
// has a lot of content (trade count + P&L text), so the fixed-height weekly
// cards drift out of alignment with their calendar rows over the course of a
// month. This measures each rendered row/card pair and corrects it directly.
function syncWeeklyHeights(){
  const dowRow = document.querySelector('.dow-row');
  const sideTitle = document.querySelector('.side-title');
  const rowEls = calBody.querySelectorAll('.week-row');
  const cardEls = weeklyBody.querySelectorAll('.week-card');
  if(!rowEls.length || !cardEls.length) return;

  // Match the header heights first so row 1 / card 1 start at the same Y.
  if(dowRow && sideTitle){
    sideTitle.style.paddingBottom = '';
    const diff = dowRow.getBoundingClientRect().height - sideTitle.getBoundingClientRect().height;
    if(diff > 0) sideTitle.style.paddingBottom = diff + 'px';
  }

  // Each card has an 8px margin-bottom (the visual gap between cards); the
  // calendar rows have no gap between them, so subtract that gap from the
  // card's height to keep each card's bottom edge lined up with its row's
  // bottom edge (and the next row/card pair starting flush again).
  const gap = 8;
  rowEls.forEach((rowEl, i) => {
    const card = cardEls[i];
    if(!card) return;
    const rowH = rowEl.getBoundingClientRect().height;
    card.style.minHeight = Math.max(0, rowH - gap) + 'px';
  });
}

window.addEventListener('resize', () => {
  clearTimeout(window.__wkResizeTimer);
  window.__wkResizeTimer = setTimeout(syncWeeklyHeights, 150);
});

async function loadMonth(){
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  monthLabelEl.textContent = viewDate.toLocaleDateString('en-US', {month:'long', year:'numeric'});
  statusLine.textContent = "Loading…";
  statusLine.className = "loading";
  monthPill.textContent = "Loading…";
  calBody.innerHTML = "";
  weeklyBody.innerHTML = "";

  const rangeStart = toISO(startOfGrid(year, month));
  const rangeEnd = toISO(endOfGrid(year, month));

  try{
    const trades = await fetchTrades(rangeStart, rangeEnd);
    if(trades === null){
      statusLine.textContent = "Couldn't parse the response from Notion. Try again.";
      statusLine.className = "err";
      render([], year, month);
      return;
    }
    updateStatusLine();
    render(trades, year, month);
    renderYearlyMonthlyReport(year, month);
    if(typeof Chart !== 'undefined') renderMonthlyChart(TRADES, year);
    document.querySelector('.layout').classList.remove('fade-in');
    void document.querySelector('.layout').offsetWidth; // restart animation
    document.querySelector('.layout').classList.add('fade-in');
  }catch(e){
    console.error(e);
    statusLine.textContent = "Something went wrong rendering this month.";
    statusLine.className = "err";
    render([], year, month);
  }
}

document.getElementById('prevBtn').addEventListener('click', () => {
  viewDate.setMonth(viewDate.getMonth() - 1);
  loadMonth();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  viewDate.setMonth(viewDate.getMonth() + 1);
  loadMonth();
});
document.getElementById('todayBtn').addEventListener('click', () => {
  viewDate = new Date();
  loadMonth();
});

// Theme toggle (light/dark). Initial theme is set by the tiny inline script
// in <head> so the correct theme is applied before first paint (no flash).
const themeBtn = document.getElementById('themeBtn');
function applyThemeButtonIcon(){
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  themeBtn.textContent = isDark ? '☀️' : '🌙';
}
applyThemeButtonIcon();
themeBtn.addEventListener('click', () => {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const next = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('mmtrades-theme', next); }catch(e){ /* storage may be blocked; theme still applies for this session */ }
  applyThemeButtonIcon();
  // Canvas-drawn chart colors don't follow CSS automatically, so redraw them
  // with the freshly-resolved theme colors.
  if(typeof Chart !== 'undefined'){
    renderCharts(allTimeMetrics);
    renderDurationChart(DURATION_TRADES);
    renderMonthlyChart(TRADES, viewDate.getFullYear());
  }
  syncWeeklyHeights();
});

// Manual sync — same logic as the Playbook- and Statisctics dashboards' Sync button:
// re-fetch this page's own HTML (cache-busted, no-store) and pull the freshest
// TRADES/DURATION_TRADES/DATA_SYNCED_AT out of the SYNC_MARKER block that the
// GitHub Actions workflow already keeps up to date every 5 minutes, then
// re-render in place — no navigation, no token, no full page reload.
const syncBtn = document.getElementById('syncBtn');
const syncIcon = document.getElementById('syncIcon');

async function refetchSyncedData(){
  const url = location.pathname + '?_=' + Date.now();
  const res = await fetch(url, { cache: 'no-store' });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const html = await res.text();

  const start = html.indexOf('// SYNC_MARKER_START');
  const end = html.indexOf('// SYNC_MARKER_END');
  if(start === -1 || end === -1) throw new Error('sync markers not found in fetched page');
  const block = html.slice(start, end);

  const syncedAtMatch = block.match(/DATA_SYNCED_AT\s*=\s*"([^"]+)"/);
  const tradesMatch = block.match(/const TRADES\s*=\s*(\[[\s\S]*?\]);/);
  const durationMatch = block.match(/const DURATION_TRADES\s*=\s*(\[[\s\S]*?\]);/);
  if(!syncedAtMatch || !tradesMatch || !durationMatch) throw new Error('could not parse synced data');

  DATA_SYNCED_AT = syncedAtMatch[1];
  TRADES.length = 0;
  TRADES.push(...JSON.parse(tradesMatch[1]));
  DURATION_TRADES.length = 0;
  DURATION_TRADES.push(...JSON.parse(durationMatch[1]));
}

function runSync(){
  syncBtn.disabled = true;
  syncIcon.classList.add('spin');
  syncBtn.title = 'Syncing…';
  return refetchSyncedData()
    .then(() => {
      allTimeMetrics = computeMetrics(TRADES);
      renderStats(allTimeMetrics);
      if(typeof Chart !== 'undefined'){
        renderCharts(allTimeMetrics);
        renderDurationChart(DURATION_TRADES);
        renderMonthlyChart(TRADES, viewDate.getFullYear());
      }
      loadMonth();
      updateStatusLine();
      syncBtn.title = 'Synced';
    })
    .catch(err => {
      console.error(err);
      syncBtn.title = 'Sync failed — click to retry';
    })
    .finally(() => {
      syncIcon.classList.remove('spin');
      syncBtn.disabled = false;
      setTimeout(() => { syncBtn.title = 'Refresh with the latest synced data'; }, 2000);
    });
}
syncBtn.addEventListener('click', runSync);

// Same 5-minute auto-refresh cadence as the other two dashboards, so numbers stay
// current without anyone needing to click Sync — only runs while the tab is visible.
const AUTO_REFRESH_MS = 5 * 60 * 1000;
setInterval(() => {
  if(document.visibilityState === 'visible') runSync();
}, AUTO_REFRESH_MS);

// Stats + charts are all-time and only need to render once (not on month navigation)
let allTimeMetrics = computeMetrics(TRADES);
renderStats(allTimeMetrics);
loadChartJs().then(() => {
  renderCharts(allTimeMetrics);
  renderDurationChart(DURATION_TRADES);
  renderMonthlyChart(TRADES, viewDate.getFullYear());
});

loadMonth();
</script>
