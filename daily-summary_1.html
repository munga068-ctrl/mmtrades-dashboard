<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Daily Summary</title>
<style>
  :root{
    --ink:#14171c;
    --muted:#6b7280;
    --line:#e7e9ec;
    --green:#0f8a4c;
    --green-bg:#eaf7ef;
    --red:#d1352b;
    --red-bg:#fdeeed;
    --accent:#2f6fed;
    --panel:#fafbfc;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:#fff;
  }
  .wrap{ padding:20px; max-width:1200px; margin:0 auto; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px; flex-wrap:wrap; gap:12px;
  }
  .title{ font-size:20px; font-weight:700; letter-spacing:-0.01em; }
  .nav{ display:flex; align-items:center; gap:10px; }
  .nav button{
    border:1px solid var(--line); background:#fff; border-radius:8px;
    width:32px; height:32px; cursor:pointer; font-size:15px; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .nav button:hover{ background:#f4f5f6; }
  .nav .today{
    width:auto; padding:0 12px; gap:6px; font-size:13px; font-weight:600;
  }
  .month-label{ font-weight:700; font-size:15px; min-width:110px; text-align:center; }
  .summary-pill{
    font-size:13px; color:var(--muted); display:flex; gap:14px; align-items:center;
  }
  .summary-pill b{ color:var(--ink); }
  .pnl-pos{ color:var(--green); font-weight:700; }
  .pnl-neg{ color:var(--red); font-weight:700; }

  .layout{ display:flex; gap:22px; align-items:flex-start; }
  .cal-col{ flex:1; min-width:0; }
  .side-col{ width:290px; flex-shrink:0; }

  .grid{
    border:1px solid var(--line); border-radius:10px; overflow:hidden;
  }
  .dow-row{ display:grid; grid-template-columns:repeat(7,1fr); background:var(--panel); }
  .dow-row div{
    padding:8px 0; text-align:center; font-size:11px; font-weight:600;
    color:var(--muted); text-transform:uppercase; letter-spacing:.04em;
  }
  .week-row{ display:grid; grid-template-columns:repeat(7,1fr); }
  .day{
    min-height:82px; border-top:1px solid var(--line); border-right:1px solid var(--line);
    padding:8px; position:relative; transition:background .12s;
  }
  .day:nth-child(7n){ border-right:none; }
  .day.blank{ background:#fcfcfd; color:#cfd3d9; }
  .day.today{ background:#eef4ff; }
  .day .num{ font-size:13px; color:var(--muted); }
  .day.today .num{ color:var(--accent); font-weight:700; }
  .day .trades{ font-size:11px; color:var(--muted); margin-top:20px; }
  .day .amount{ font-size:14px; font-weight:700; margin-top:2px; }
  .day.win{ background:var(--green-bg); }
  .day.win .amount{ color:var(--green); }
  .day.loss{ background:var(--red-bg); }
  .day.loss .amount{ color:var(--red); }

  .side-title{ font-size:13px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; margin-bottom:10px; }
  .week-card{
    border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px;
  }
  .week-card .wk-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; }
  .week-card .wk-name{ font-weight:700; font-size:13.5px; }
  .week-card .wk-range{ font-size:11px; color:var(--muted); }
  .week-card .wk-body{ display:flex; justify-content:space-between; font-size:12.5px; }
  .week-card .no-trades{ font-size:12.5px; color:#b4b8bf; }
  .loading{ font-size:12px; color:var(--muted); padding:2px 0 10px; }
  .err{ font-size:12px; color:var(--red); padding:2px 0 10px; }

  @media (max-width:760px){
    .layout{ flex-direction:column; }
    .side-col{ width:100%; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="title">Daily Summary</div>
    <div class="nav">
      <button id="prevBtn">‹</button>
      <div class="month-label" id="monthLabel">—</div>
      <button id="nextBtn">›</button>
      <button class="today" id="todayBtn">Today</button>
    </div>
    <div class="summary-pill" id="monthPill">Loading…</div>
  </div>

  <div id="statusLine" class="loading">Fetching trades from Notion…</div>

  <div class="layout">
    <div class="cal-col">
      <div class="dow-row">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div id="calBody"></div>
    </div>
    <div class="side-col">
      <div class="side-title">Weekly Summary</div>
      <div id="weeklyBody"></div>
    </div>
  </div>
</div>

<script>
// ---- Notion data source for MMTrades DASHBOARD ----
const DATA_SOURCE_URL = "collection://2c1f7bb7-7d6d-81e3-b25f-000b608c1561";

let viewDate = new Date(); // current month being viewed
const todayStr = new Date().toISOString().slice(0,10);

const monthLabelEl = document.getElementById('monthLabel');
const calBody = document.getElementById('calBody');
const weeklyBody = document.getElementById('weeklyBody');
const monthPill = document.getElementById('monthPill');
const statusLine = document.getElementById('statusLine');

function fmtMoney(n){
  const sign = n < 0 ? "-" : "";
  return sign + "$" + Math.abs(n).toFixed(2);
}

function startOfGrid(year, month){
  const first = new Date(year, month, 1);
  const d = new Date(first);
  d.setDate(d.getDate() - d.getDay());
  return d;
}
function endOfGrid(year, month){
  const last = new Date(year, month + 1, 0);
  const d = new Date(last);
  d.setDate(d.getDate() + (6 - d.getDay()));
  return d;
}
function toISO(d){ return d.toISOString().slice(0,10); }

async function fetchTrades(rangeStart, rangeEnd){
  const prompt = `Use the notion query_data_sources tool in SQL mode with data_source_urls: ["${DATA_SOURCE_URL}"] and this exact query: SELECT "date:Date:start" as d, "REALIZED PNL" as pnl FROM "${DATA_SOURCE_URL}" WHERE date("date:Date:start") >= date('${rangeStart}') AND date("date:Date:start") <= date('${rangeEnd}') AND "REALIZED PNL" IS NOT NULL ORDER BY d ASC. Then respond with ONLY a raw JSON array (no markdown, no commentary) of objects like [{"date":"YYYY-MM-DD","pnl":123.45}]. If there are no rows, respond with [].`;

  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }],
      mcp_servers: [{ type: "url", url: "https://mcp.notion.com/mcp", name: "notion-mcp" }]
    })
  });
  const data = await response.json();
  const textBlocks = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
  const cleaned = textBlocks.replace(/```json|```/g, "").trim();
  try{
    const parsed = JSON.parse(cleaned);
    return Array.isArray(parsed) ? parsed : [];
  }catch(e){
    console.error("Parse failed", e, textBlocks);
    return null; // signal error
  }
}

function render(trades, year, month){
  const byDate = {};
  (trades || []).forEach(t => {
    const key = (t.date || "").slice(0,10);
    if(!key) return;
    if(!byDate[key]) byDate[key] = { count:0, pnl:0 };
    byDate[key].count += 1;
    byDate[key].pnl += Number(t.pnl) || 0;
  });

  const gridStart = startOfGrid(year, month);
  const gridEnd = endOfGrid(year, month);

  // Build weeks
  const weeks = [];
  let cursor = new Date(gridStart);
  while(cursor <= gridEnd){
    const week = [];
    for(let i=0;i<7;i++){
      week.push(new Date(cursor));
      cursor.setDate(cursor.getDate()+1);
    }
    weeks.push(week);
  }

  // Render calendar
  calBody.innerHTML = "";
  let monthPnl = 0, monthDays = 0;

  weeks.forEach(week => {
    const row = document.createElement('div');
    row.className = 'week-row';
    week.forEach(d => {
      const inMonth = d.getMonth() === month;
      const iso = toISO(d);
      const cell = document.createElement('div');
      cell.className = 'day' + (inMonth ? '' : ' blank') + (iso === todayStr ? ' today' : '');
      const info = byDate[iso];
      let inner = `<div class="num">${d.getDate()}</div>`;
      if(inMonth && info){
        const cls = info.pnl >= 0 ? 'win' : 'loss';
        cell.classList.add(cls);
        inner += `<div class="trades">${info.count} ⇄</div><div class="amount">${fmtMoney(info.pnl)}</div>`;
        if(inMonth){ monthPnl += info.pnl; monthDays += 1; }
      }
      cell.innerHTML = inner;
      row.appendChild(cell);
    });
    calBody.appendChild(row);
  });

  monthPill.innerHTML = `PnL: <span class="${monthPnl >= 0 ? 'pnl-pos' : 'pnl-neg'}">${fmtMoney(monthPnl)}</span> &nbsp;|&nbsp; Days: <b>${monthDays}</b>`;

  // Weekly summary sidebar
  weeklyBody.innerHTML = "";
  const ordinals = ["One","Two","Three","Four","Five","Six"];
  weeks.forEach((week, i) => {
    const start = week[0], end = week[6];
    const rangeLabel = `${start.toLocaleDateString('en-US',{month:'short',day:'numeric'})} - ${end.toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;
    let pnl = 0, days = 0;
    week.forEach(d => {
      if(d.getMonth() !== month) return;
      const iso = toISO(d);
      if(byDate[iso]){ pnl += byDate[iso].pnl; days += 1; }
    });
    const card = document.createElement('div');
    card.className = 'week-card';
    if(days > 0){
      card.innerHTML = `
        <div class="wk-head"><span class="wk-name">Week ${ordinals[i] || i+1}</span><span class="wk-range">${rangeLabel}</span></div>
        <div class="wk-body"><span>PnL: <b class="${pnl >= 0 ? 'pnl-pos':'pnl-neg'}">${fmtMoney(pnl)}</b></span><span>Days: <b>${days}</b></span></div>
      `;
    } else {
      card.innerHTML = `
        <div class="wk-head"><span class="wk-name">Week ${ordinals[i] || i+1}</span><span class="wk-range">${rangeLabel}</span></div>
        <div class="no-trades">No trades</div>
      `;
    }
    weeklyBody.appendChild(card);
  });
}

async function loadMonth(){
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  monthLabelEl.textContent = viewDate.toLocaleDateString('en-US', {month:'long', year:'numeric'});
  statusLine.textContent = "Fetching trades from Notion…";
  statusLine.className = "loading";
  monthPill.textContent = "Loading…";
  calBody.innerHTML = "";
  weeklyBody.innerHTML = "";

  const rangeStart = toISO(startOfGrid(year, month));
  const rangeEnd = toISO(endOfGrid(year, month));

  try{
    const trades = await fetchTrades(rangeStart, rangeEnd);
    if(trades === null){
      statusLine.textContent = "Couldn't parse the response from Notion. Try again.";
      statusLine.className = "err";
      render([], year, month);
      return;
    }
    statusLine.textContent = "";
    render(trades, year, month);
  }catch(e){
    console.error(e);
    statusLine.textContent = "Couldn't reach Notion right now. Try again.";
    statusLine.className = "err";
    render([], year, month);
  }
}

document.getElementById('prevBtn').addEventListener('click', () => {
  viewDate.setMonth(viewDate.getMonth() - 1);
  loadMonth();
});
document.getElementById('nextBtn').addEventListener('click', () => {
  viewDate.setMonth(viewDate.getMonth() + 1);
  loadMonth();
});
document.getElementById('todayBtn').addEventListener('click', () => {
  viewDate = new Date();
  loadMonth();
});

loadMonth();
</script>
</body>
</html>
